<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Камертон — тренування слуху</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #142229;
    --bg-2: #0f1b21;
    --panel: #1b3038;
    --panel-line: rgba(238,242,240,0.09);
    --text: #eef2ef;
    --muted: #9fb6b0;
    --muted-2: #6f8c85;
    --accent: #e8a13c;
    --accent-dim: #a97730;
    --good: #7fb89f;
    --bad: #cf7360;
    --radius-panel: 18px;
    --radius-btn: 10px;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }

  body{
    background: radial-gradient(circle at 20% -10%, #1a3038 0%, var(--bg) 45%, var(--bg-2) 100%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    line-height: 1.45;
  }

  .wrap{ max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }

  header.top{
    display:flex; align-items: baseline; justify-content: space-between;
    gap: 16px; margin-bottom: 26px; flex-wrap: wrap;
  }
  .brand{ display:flex; align-items:baseline; gap: 12px; }
  .brand h1{ font-family:'Fraunces', serif; font-weight: 600; font-size: 30px; margin: 0; letter-spacing: 0.2px; }
  .brand .fork{ font-size: 26px; transform: rotate(-8deg); display:inline-block; }
  .brand .tag{ color: var(--muted); font-size: 14px; font-family:'IBM Plex Mono', monospace; }

  .score{ font-family:'IBM Plex Mono', monospace; font-size: 13px; color: var(--muted); display:flex; gap: 18px; align-items:center; }
  .score b{ color: var(--accent); font-weight:600; }
  .score button{
    background: none; border: 1px solid var(--panel-line); color: var(--muted);
    font-family: inherit; font-size: 12px; padding: 5px 10px; border-radius: 8px; cursor: pointer;
  }
  .score button:hover{ color: var(--text); border-color: var(--muted-2); }

  nav.modes{
    display:flex; gap: 6px; background: var(--panel); border: 1px solid var(--panel-line);
    border-radius: 14px; padding: 5px; margin-bottom: 22px; width: fit-content;
  }
  nav.modes button{
    font-family: 'Inter', sans-serif; font-size: 14.5px; font-weight: 500; color: var(--muted);
    background: none; border: none; padding: 9px 18px; border-radius: 10px; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  nav.modes button.active{ background: var(--accent); color: #241505; }
  nav.modes button:not(.active):hover{ color: var(--text); }

  .layout{ display:grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 760px){ .layout{ grid-template-columns: 1fr; } }

  .panel{ background: var(--panel); border: 1px solid var(--panel-line); border-radius: var(--radius-panel); padding: 20px; }
  .panel h2{ font-size: 13px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); margin: 0; font-weight: 500; }

  .check-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom: 14px; flex-wrap: wrap; }
  .mini-btns{ display:flex; gap:6px; }
  .mini-btn{
    font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); background:none;
    border: 1px solid var(--panel-line); padding: 4px 9px; border-radius: 6px; cursor: pointer;
  }
  .mini-btn:hover{ color: var(--text); border-color: var(--muted-2); }

  .check-list{ display:flex; flex-direction: column; gap: 4px; }
  .check-row{ display:flex; align-items:center; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; font-size: 14px; user-select:none; }
  .check-row:hover{ background: rgba(255,255,255,0.04); }
  .check-row input{ accent-color: var(--accent); width:15px; height:15px; }
  .check-row .code{ font-family:'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted-2); margin-left: auto; }

  .divider{ height:1px; background: var(--panel-line); margin: 16px 0; }

  .num-input{
    width: 100%; background: var(--bg-2); border: 1px solid var(--panel-line); color: var(--text);
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; padding: 9px 10px; border-radius: 8px;
  }
  .num-input:focus{ outline: 1px solid var(--accent); border-color: var(--accent); }

  .stage{
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: var(--radius-panel);
    padding: 30px 26px; display:flex; flex-direction: column; align-items:center; gap: 18px;
    min-height: 420px; justify-content: center;
  }

  .series-progress{ font-family:'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--muted-2); letter-spacing: 0.3px; }

  #stageContent{ display:flex; flex-direction: column; align-items:center; gap: 20px; width:100%; }

  .play-btn{
    width: 108px; height: 108px; border-radius: 50%;
    background: linear-gradient(160deg, #f0b154, var(--accent-dim)); border: none; color: #241505;
    font-size: 34px; cursor: pointer;
    box-shadow: 0 0 0 6px rgba(232,161,60,0.08), 0 8px 20px rgba(0,0,0,0.35);
    transition: transform 0.12s ease;
  }
  .play-btn:hover{ transform: scale(1.04); }
  .play-btn:active{ transform: scale(0.97); }
  .play-btn:disabled{ opacity: 0.45; cursor: default; transform:none; }

  .replay{
    font-family:'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--muted); background:none;
    border: 1px solid var(--panel-line); padding: 6px 14px; border-radius: 8px; cursor: pointer;
  }
  .replay:hover{ color: var(--text); border-color: var(--muted-2); }
  .replay:disabled{ opacity: 0.4; cursor: default; }

  .prompt{ font-family:'Fraunces', serif; font-style: italic; color: var(--muted); font-size: 15px; text-align:center; min-height: 20px; }

  .answers{ display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; width: 100%; max-width: 640px; }
  .ans-btn{
    font-family:'Inter', sans-serif; font-size: 14px; font-weight: 500; background: var(--bg-2);
    border: 1px solid var(--panel-line); color: var(--text); padding: 13px 12px; border-radius: var(--radius-btn);
    cursor: pointer; transition: background 0.12s, border-color 0.12s;
  }
  .ans-btn:hover:not(:disabled){ border-color: var(--muted-2); }
  .ans-btn:disabled{ cursor: default; }
  .ans-btn.correct{ background: rgba(127,184,159,0.18); border-color: var(--good); color: var(--good); }
  .ans-btn.wrong{ background: rgba(207,115,96,0.18); border-color: var(--bad); color: var(--bad); }
  .ans-btn.reveal{ border-color: var(--good); }

  .feedback{ font-family: 'IBM Plex Mono', monospace; font-size: 13px; min-height: 18px; color: var(--muted); }
  .feedback.good{ color: var(--good); }
  .feedback.bad{ color: var(--bad); }

  .next-btn{
    font-family:'Inter', sans-serif; font-weight: 500; font-size: 14px; background: var(--accent);
    color: #241505; border:none; padding: 10px 22px; border-radius: var(--radius-btn); cursor: pointer;
    visibility: hidden;
  }
  .next-btn.show{ visibility: visible; }
  .next-btn:hover{ filter: brightness(1.08); }

  .hint{ font-size: 12px; color: var(--muted-2); text-align:center; max-width: 480px; margin-top: -6px; }

  .summary{ width:100%; max-width: 680px; }
  .summary-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom: 16px; flex-wrap: wrap; }
  .summary-head h2{ font-family:'Fraunces', serif; font-weight:600; font-size:22px; margin:0; color: var(--text); }
  .summary-score{ font-family:'IBM Plex Mono', monospace; font-size: 13.5px; color: var(--accent); }
  .summary-list{ display:flex; flex-direction:column; gap:6px; max-height: 320px; overflow-y:auto; padding-right: 4px; }
  .summary-row{
    display:flex; align-items:center; gap:10px; flex-wrap: wrap;
    background: var(--bg-2); border: 1px solid var(--panel-line); border-radius: 10px; padding: 9px 12px; font-size: 13.5px;
  }
  .summary-idx{ font-family:'IBM Plex Mono', monospace; color: var(--muted-2); min-width: 22px; }
  .summary-target{ font-weight: 500; }
  .badge-correct, .badge-wrong{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; padding: 2px 8px; border-radius: 6px; margin-left: auto;
  }
  .badge-correct{ background: rgba(127,184,159,0.18); color: var(--good); }
  .badge-wrong{ background: rgba(207,115,96,0.18); color: var(--bad); }
  .summary-user{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); flex-basis: 100%; }
  .summary .next-btn{ margin-top: 6px; }
  .summary-actions{ display:flex; align-items:center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .ghost-btn{
    font-family:'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--muted); background:none;
    border: 1px solid var(--panel-line); padding: 8px 14px; border-radius: 8px; cursor: pointer;
  }
  .ghost-btn:hover{ color: var(--text); border-color: var(--muted-2); }
  .summary-msg{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--good); }

  footer{ text-align:center; color: var(--muted-2); font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; margin-top: 34px; }

  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <span class="fork">🎵</span>
      <h1>Камертон</h1>
      <span class="tag">тренування слуху · безкоштовно</span>
    </div>
    <div class="score">
      <span>вірно: <b id="scoreCorrect">0</b>/<span id="scoreTotal">0</span></span>
      <span>серія: <b id="scoreStreak">0</b></span>
      <button id="resetScore" type="button">скинути рахунок</button>
    </div>
  </header>

  <nav class="modes">
    <button class="active" data-mode="intervals">Інтервали</button>
    <button data-mode="triads">Тризвуки</button>
    <button data-mode="timbre">Тембри</button>
  </nav>

  <div class="layout">
    <div class="panel" id="settingsPanel"></div>

    <div class="stage">
      <div class="series-progress" id="seriesProgress"></div>

      <div id="stageContent">
        <button class="play-btn" id="playBtn" title="Відтворити">▶</button>
        <button class="replay" id="replayBtn" disabled>відтворити ще раз</button>
        <div class="prompt" id="prompt">Натисніть кнопку, щоб почути перший приклад</div>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="nextBtn" type="button">Наступне →</button>
      </div>

      <div class="summary" id="summaryPanel" style="display:none;"></div>
    </div>
  </div>

  <footer>Звук синтезується прямо у вашому браузері (Web Audio API) — нічого не завантажується і нічого не коштує.</footer>
</div>

<script>
(function(){

  // ---------- audio engine ----------
  let ctx = null;
  function ensureCtx(){
    if(!ctx){ ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    if(ctx.state === 'suspended'){ ctx.resume(); }
    return ctx;
  }

  function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }

  function playTone(freq, startAt, duration, wave){
    const c = ensureCtx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = wave || 'sine';
    osc.frequency.value = freq;
    const t0 = c.currentTime + startAt;
    const attack = 0.02, release = 0.15;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(0.28, t0 + attack);
    gain.gain.setValueAtTime(0.28, t0 + duration - release);
    gain.gain.linearRampToValueAtTime(0, t0 + duration);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  function playSequence(freqs, wave, mode){
    const dur = 1.0;
    if(mode === 'together'){
      freqs.forEach(f => playTone(f, 0, dur + 0.4, wave));
    } else {
      const gap = 0.85;
      freqs.forEach((f, i) => playTone(f, i * gap, dur, wave));
    }
  }

  // ---------- data ----------
  const INTERVALS = [
    {code:'m2', semis:1,  label:'мала секунда'},
    {code:'M2', semis:2,  label:'велика секунда'},
    {code:'m3', semis:3,  label:'мала терція'},
    {code:'M3', semis:4,  label:'велика терція'},
    {code:'P4', semis:5,  label:'чиста кварта'},
    {code:'TT', semis:6,  label:'тритон'},
    {code:'P5', semis:7,  label:'чиста квінта'},
    {code:'m6', semis:8,  label:'мала секста'},
    {code:'M6', semis:9,  label:'велика секста'},
    {code:'m7', semis:10, label:'мала септима'},
    {code:'M7', semis:11, label:'велика септима'},
    {code:'P8', semis:12, label:'октава'}
  ];

  const DIRECTIONS = [
    {code:'up', label:'вгору (спочатку нижча нота)'},
    {code:'down', label:'вниз (спочатку вища нота)'},
    {code:'together', label:'разом (як акорд)'}
  ];

  const TRIADS = [
    {code:'maj', semis:[0,4,7], label:'мажорний'},
    {code:'min', semis:[0,3,7], label:'мінорний'},
    {code:'dim', semis:[0,3,6], label:'зменшений'},
    {code:'aug', semis:[0,4,8], label:'збільшений'}
  ];

  const TRIAD_INVERSIONS = [
    {code:'root', label:'основний вигляд'},
    {code:'inv1', label:'перше обернення'},
    {code:'inv2', label:'друге обернення'}
  ];

  const CHORD_STYLES = [
    {code:'block', label:'блок-акорд (всі ноти разом)'},
    {code:'arp-up', label:'арпеджіо по черзі вгору'},
    {code:'arp-down', label:'арпеджіо по черзі вниз'}
  ];

  const TIMBRES = [
    {code:'sine',     wave:'sine',     label:'синусоїда', hint:'м’який, "чистий" звук'},
    {code:'triangle', wave:'triangle', label:'трикутна',  hint:'округлий, приглушений'},
    {code:'square',   wave:'square',   label:'прямокутна', hint:'різкий, "цифровий"'},
    {code:'sawtooth', wave:'sawtooth', label:'пилкоподібна', hint:'гострий, дзижчний'}
  ];

  function chordVoicing(semis, invCode){
    const t = semis[1], f = semis[2];
    if(invCode === 'inv1') return [t, f, 12];
    if(invCode === 'inv2') return [f, 12, 12 + t];
    return [0, t, f];
  }

  // ---------- state ----------
  const state = {
    mode: 'intervals',
    enabled: {
      intervals: new Set(INTERVALS.map(i=>i.code)),
      direction: new Set(DIRECTIONS.map(d=>d.code)),
      triads: new Set(TRIADS.map(t=>t.code)),
      chordStyle: new Set(CHORD_STYLES.map(s=>s.code)),
      timbre: new Set(TIMBRES.map(t=>t.code)),
      inversions: new Set(['root','inv1','inv2'])
    },
    trainingWave: {
      intervals: new Set(TIMBRES.map(t=>t.code)),
      triads: new Set(TIMBRES.map(t=>t.code))
    },
    seriesLength: 10,
    seriesIndex: 0,
    seriesLog: [],
    current: null,
    answered: false,
    score: { correct: 0, total: 0, streak: 0 }
  };

  // ---------- DOM refs ----------
  const settingsPanel = document.getElementById('settingsPanel');
  const answersEl = document.getElementById('answers');
  const promptEl = document.getElementById('prompt');
  const feedbackEl = document.getElementById('feedback');
  const playBtn = document.getElementById('playBtn');
  const replayBtn = document.getElementById('replayBtn');
  const nextBtn = document.getElementById('nextBtn');
  const scoreCorrect = document.getElementById('scoreCorrect');
  const scoreTotal = document.getElementById('scoreTotal');
  const scoreStreak = document.getElementById('scoreStreak');
  const seriesProgress = document.getElementById('seriesProgress');
  const stageContent = document.getElementById('stageContent');
  const summaryPanel = document.getElementById('summaryPanel');

  function renderScore(){
    scoreCorrect.textContent = state.score.correct;
    scoreTotal.textContent = state.score.total;
    scoreStreak.textContent = state.score.streak;
  }

  document.getElementById('resetScore').addEventListener('click', ()=>{
    state.score = { correct:0, total:0, streak:0 };
    renderScore();
  });

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }

  // ---------- settings panel rendering ----------
  function renderSettings(){
    settingsPanel.innerHTML = '';

    settingsPanel.appendChild(buildSeriesLengthControl());
    settingsPanel.appendChild(divider());

    if(state.mode === 'intervals'){
      settingsPanel.appendChild(buildChecklist('Які інтервали тренувати', INTERVALS, state.enabled.intervals, {selectAll:true}));
      settingsPanel.appendChild(divider());
      settingsPanel.appendChild(buildChecklist('Напрямок відтворення', DIRECTIONS, state.enabled.direction));
      settingsPanel.appendChild(divider());
      settingsPanel.appendChild(buildChecklist('Тембр звучання', TIMBRES, state.trainingWave.intervals));
    }

    if(state.mode === 'triads'){
      settingsPanel.appendChild(buildChecklist('Які тризвуки тренувати', TRIADS, state.enabled.triads));
      settingsPanel.appendChild(divider());
      settingsPanel.appendChild(buildChecklist('Спосіб відтворення', CHORD_STYLES, state.enabled.chordStyle));
      settingsPanel.appendChild(divider());
      settingsPanel.appendChild(buildChecklist('Обернення тризвуків', TRIAD_INVERSIONS, state.enabled.inversions));
      settingsPanel.appendChild(divider());
      settingsPanel.appendChild(buildChecklist('Тембр звучання', TIMBRES, state.trainingWave.triads));
    }

    if(state.mode === 'timbre'){
      settingsPanel.appendChild(buildChecklist('Які тембри тренувати', TIMBRES, state.enabled.timbre));
      const p = document.createElement('p');
      p.className = 'hint';
      p.style.marginTop = '12px';
      p.textContent = 'Тут "тембр" — це форма хвилі синтезатора, а не звук реального інструмента.';
      settingsPanel.appendChild(p);
    }
  }

  function buildSeriesLengthControl(){
    const box = document.createElement('div');
    const h = document.createElement('h2');
    h.style.marginBottom = '14px';
    h.textContent = 'Кількість прикладів у серії';
    box.appendChild(h);

    const select = document.createElement('select');
    select.className = 'num-input';
    for(let v = 3; v <= 36; v++){
      const opt = document.createElement('option');
      opt.value = String(v);
      opt.textContent = String(v);
      select.appendChild(opt);
    }
    select.value = String(Math.max(3, Math.min(36, state.seriesLength)));
    select.addEventListener('change', ()=>{
      state.seriesLength = parseInt(select.value, 10);
      resetSeries();
    });
    box.appendChild(select);
    return box;
  }

  function buildChecklist(title, items, enabledSet, opts){
    opts = opts || {};
    const box = document.createElement('div');

    const head = document.createElement('div');
    head.className = 'check-head';
    const h = document.createElement('h2');
    h.textContent = title;
    head.appendChild(h);

    if(opts.selectAll){
      const mini = document.createElement('div');
      mini.className = 'mini-btns';
      const allBtn = document.createElement('button');
      allBtn.type = 'button';
      allBtn.className = 'mini-btn';
      allBtn.textContent = 'обрати всі';
      allBtn.addEventListener('click', ()=>{
        items.forEach(it => enabledSet.add(it.code));
        renderSettings();
      });
      const noneBtn = document.createElement('button');
      noneBtn.type = 'button';
      noneBtn.className = 'mini-btn';
      noneBtn.textContent = 'очистити всі';
      noneBtn.addEventListener('click', ()=>{
        enabledSet.clear();
        renderSettings();
      });
      mini.appendChild(allBtn);
      mini.appendChild(noneBtn);
      head.appendChild(mini);
    }
    box.appendChild(head);

    const list = document.createElement('div');
    list.className = 'check-list';
    items.forEach(item=>{
      const row = document.createElement('label');
      row.className = 'check-row';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = enabledSet.has(item.code);
      cb.addEventListener('change', ()=>{
        if(cb.checked) enabledSet.add(item.code); else enabledSet.delete(item.code);
      });
      const span = document.createElement('span');
      span.textContent = item.label;
      const code = document.createElement('span');
      code.className = 'code';
      code.textContent = item.code;
      row.appendChild(cb);
      row.appendChild(span);
      row.appendChild(code);
      list.appendChild(row);
    });
    box.appendChild(list);
    return box;
  }

  function divider(){
    const d = document.createElement('div');
    d.className = 'divider';
    return d;
  }

  // ---------- round logic ----------
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function enabledList(){
    if(state.mode === 'intervals') return INTERVALS.filter(i => state.enabled.intervals.has(i.code));
    if(state.mode === 'triads') return TRIADS.filter(t => state.enabled.triads.has(t.code));
    if(state.mode === 'timbre') return TIMBRES.filter(t => state.enabled.timbre.has(t.code));
  }

  function buildRound(){
    const pool = enabledList();
    if(pool.length === 0){
      promptEl.textContent = 'Оберіть хоча б один варіант у налаштуваннях зліва.';
      answersEl.innerHTML = '';
      return null;
    }

    if(state.mode === 'intervals'){
      const dirPool = DIRECTIONS.filter(d => state.enabled.direction.has(d.code));
      if(dirPool.length === 0){
        promptEl.textContent = 'Оберіть хоча б один напрямок відтворення у налаштуваннях зліва.';
        answersEl.innerHTML = '';
        return null;
      }
      const wavePool = TIMBRES.filter(t => state.trainingWave.intervals.has(t.code));
      if(wavePool.length === 0){
        promptEl.textContent = 'Оберіть хоча б один тембр звучання у налаштуваннях зліва.';
        answersEl.innerHTML = '';
        return null;
      }
      const item = pick(pool);
      const dir = pick(dirPool).code;
      const wave = pick(wavePool).wave;
      const rootMidi = 55 + Math.floor(Math.random()*12);
      const rootFreq = midiToFreq(rootMidi);
      const otherFreq = midiToFreq(rootMidi + item.semis);
      let freqs;
      if(dir === 'down') freqs = [otherFreq, rootFreq];
      else freqs = [rootFreq, otherFreq];
      return { code: item.code, freqs, wave, playMode: dir === 'together' ? 'together' : 'seq', pool };
    }

    if(state.mode === 'triads'){
      const invPool = TRIAD_INVERSIONS.filter(iv => state.enabled.inversions.has(iv.code));
      if(invPool.length === 0){
        promptEl.textContent = 'Оберіть хоча б одне обернення у налаштуваннях зліва.';
        answersEl.innerHTML = '';
        return null;
      }
      const stylePool = CHORD_STYLES.filter(s => state.enabled.chordStyle.has(s.code));
      if(stylePool.length === 0){
        promptEl.textContent = 'Оберіть хоча б один спосіб відтворення у налаштуваннях зліва.';
        answersEl.innerHTML = '';
        return null;
      }
      const wavePool = TIMBRES.filter(t => state.trainingWave.triads.has(t.code));
      if(wavePool.length === 0){
        promptEl.textContent = 'Оберіть хоча б один тембр звучання у налаштуваннях зліва.';
        answersEl.innerHTML = '';
        return null;
      }
      const item = pick(pool);
      const invItem = pick(invPool);
      const style = pick(stylePool).code;
      const wave = pick(wavePool).wave;
      const rootMidi = 50 + Math.floor(Math.random()*9);
      let voicing = chordVoicing(item.semis, invItem.code);
      let playMode = 'seq';
      if(style === 'block'){ playMode = 'together'; }
      else if(style === 'arp-down'){ voicing = voicing.slice().reverse(); }
      const freqs = voicing.map(s => midiToFreq(rootMidi + s));
      return { code: item.code, freqs, wave, playMode, pool };
    }

    if(state.mode === 'timbre'){
      const item = pick(pool);
      const midi = 64 + Math.floor(Math.random()*6) - 3;
      const freq = midiToFreq(midi);
      return { code: item.code, freqs: [freq], wave: item.wave, playMode: 'together', pool };
    }
  }

  function labelFor(mode, code){
    const src = mode === 'intervals' ? INTERVALS : mode === 'triads' ? TRIADS : TIMBRES;
    const found = src.find(x => x.code === code);
    return found ? found.label : code;
  }

  function renderAnswers(round){
    answersEl.innerHTML = '';
    round.pool.forEach(item=>{
      const btn = document.createElement('button');
      btn.className = 'ans-btn';
      btn.textContent = item.label;
      btn.dataset.code = item.code;
      btn.disabled = true;
      btn.addEventListener('click', ()=> handleAnswer(item.code, btn));
      answersEl.appendChild(btn);
    });
  }

  function playCurrent(){
    if(!state.current) return;
    const c = state.current;
    playSequence(c.freqs, c.wave, c.playMode === 'together' ? 'together' : 'up');
    replayBtn.disabled = false;
    if(!state.answered){
      answersEl.querySelectorAll('.ans-btn').forEach(b => b.disabled = false);
    }
  }

  function startRound(){
    if(state.seriesIndex >= state.seriesLength){
      showSummary();
      return;
    }
    state.answered = false;
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
    nextBtn.classList.remove('show');
    nextBtn.textContent = 'Наступне →';
    replayBtn.disabled = true;

    const round = buildRound();
    if(!round){ state.current = null; return; }
    state.current = round;
    renderAnswers(round);
    seriesProgress.textContent = 'Приклад ' + (state.seriesIndex + 1) + ' з ' + state.seriesLength;
    promptEl.textContent = 'Натисніть ▶, щоб почути приклад';
    playCurrent();
  }

  function handleAnswer(code, btn){
    if(state.answered || !state.current) return;
    state.answered = true;
    const correctCode = state.current.code;
    const isCorrect = code === correctCode;

    state.score.total += 1;
    if(isCorrect){
      state.score.correct += 1;
      state.score.streak += 1;
      btn.classList.add('correct');
      feedbackEl.textContent = 'Правильно — ' + labelFor(state.mode, correctCode) + '.';
      feedbackEl.className = 'feedback good';
    } else {
      state.score.streak = 0;
      btn.classList.add('wrong');
      feedbackEl.textContent = 'Не зовсім. Правильна відповідь: ' + labelFor(state.mode, correctCode) + '.';
      feedbackEl.className = 'feedback bad';
      const correctBtn = answersEl.querySelector('[data-code="'+correctCode+'"]');
      if(correctBtn) correctBtn.classList.add('reveal');
    }
    renderScore();

    state.seriesLog.push({
      targetLabel: labelFor(state.mode, correctCode),
      userLabel: labelFor(state.mode, code),
      correct: isCorrect
    });
    state.seriesIndex += 1;

    answersEl.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);
    nextBtn.textContent = state.seriesIndex >= state.seriesLength ? 'Показати підсумок →' : 'Наступне →';
    nextBtn.classList.add('show');
  }

  function modeLabel(){
    return state.mode === 'intervals' ? 'Інтервали' : state.mode === 'triads' ? 'Тризвуки' : 'Тембри';
  }

  function buildSummaryText(){
    const correctCount = state.seriesLog.filter(l=>l.correct).length;
    const lines = [];
    lines.push('Камертон — підсумок серії');
    lines.push('Розділ: ' + modeLabel());
    lines.push('Дата: ' + new Date().toLocaleString('uk-UA'));
    lines.push('Результат: ' + correctCount + ' з ' + state.seriesLog.length + ' правильно');
    lines.push('');
    state.seriesLog.forEach((entry, i)=>{
      let line = (i+1) + '. ' + entry.targetLabel + ' — ' + (entry.correct ? 'вірно' : 'невірно');
      if(!entry.correct) line += ' (ваша відповідь: ' + entry.userLabel + ')';
      lines.push(line);
    });
    return lines.join('\n');
  }

  function saveSummary(){
    const text = buildSummaryText();
    const blob = new Blob([text], {type: 'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g, '-');
    a.href = url;
    a.download = 'kamerton-rezultat-' + stamp + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
  }

  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }

  function copySummary(msgEl){
    const text = buildSummaryText();
    const showCopied = ()=>{
      msgEl.textContent = 'Скопійовано!';
      setTimeout(()=>{ msgEl.textContent = ''; }, 2000);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(showCopied).catch(()=>{
        fallbackCopy(text); showCopied();
      });
    } else {
      fallbackCopy(text); showCopied();
    }
  }

  function renderSummaryPanel(){
    const correctCount = state.seriesLog.filter(l=>l.correct).length;
    let html = '';
    html += '<div class="summary-head"><h2>Підсумок серії</h2><div class="summary-score">' + correctCount + ' / ' + state.seriesLog.length + ' правильно</div></div>';
    html += '<div class="summary-list">';
    state.seriesLog.forEach((entry, i)=>{
      const badgeClass = entry.correct ? 'badge-correct' : 'badge-wrong';
      const badgeText = entry.correct ? '✓ вірно' : '✗ невірно';
      html += '<div class="summary-row">' +
        '<span class="summary-idx">' + (i+1) + '.</span>' +
        '<span class="summary-target">' + escapeHtml(entry.targetLabel) + '</span>' +
        '<span class="' + badgeClass + '">' + badgeText + '</span>' +
        (!entry.correct ? '<span class="summary-user">ваша відповідь: ' + escapeHtml(entry.userLabel) + '</span>' : '') +
        '</div>';
    });
    html += '</div>';
    html += '<div class="summary-actions">' +
      '<button class="ghost-btn" id="saveSummaryBtn" type="button">Зберегти результат</button>' +
      '<button class="ghost-btn" id="copySummaryBtn" type="button">Скопіювати результат</button>' +
      '<span class="summary-msg" id="summaryMsg"></span>' +
      '</div>';
    html += '<button class="next-btn show" id="newSeriesBtn" type="button">Нова серія →</button>';
    summaryPanel.innerHTML = html;

    document.getElementById('saveSummaryBtn').addEventListener('click', saveSummary);
    document.getElementById('copySummaryBtn').addEventListener('click', ()=> copySummary(document.getElementById('summaryMsg')));
    document.getElementById('newSeriesBtn').addEventListener('click', ()=>{
      resetSeries();
      startRound();
    });
  }

  function showSummary(){
    renderSummaryPanel();
    stageContent.style.display = 'none';
    summaryPanel.style.display = '';
    const correctCount = state.seriesLog.filter(l=>l.correct).length;
    seriesProgress.textContent = 'Серію завершено — ' + correctCount + ' з ' + state.seriesLog.length + ' правильно';
  }

  function resetSeries(){
    state.seriesIndex = 0;
    state.seriesLog = [];
    state.current = null;
    state.answered = false;
    summaryPanel.style.display = 'none';
    stageContent.style.display = '';
    answersEl.innerHTML = '';
    feedbackEl.textContent = '';
    feedbackEl.className = 'feedback';
    nextBtn.classList.remove('show');
    replayBtn.disabled = true;
    promptEl.textContent = 'Натисніть ▶, щоб почути приклад';
    seriesProgress.textContent = '';
  }

  playBtn.addEventListener('click', ()=>{
    if(!state.current){ startRound(); }
    else { playCurrent(); }
  });
  replayBtn.addEventListener('click', playCurrent);
  nextBtn.addEventListener('click', ()=>{
    if(state.seriesIndex >= state.seriesLength){ showSummary(); }
    else { startRound(); }
  });

  document.querySelectorAll('nav.modes button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('nav.modes button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      state.mode = btn.dataset.mode;
      renderSettings();
      resetSeries();
    });
  });

  renderSettings();
  renderScore();
})();
</script>
</body>
</html>
